name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Modelos de separação (branch models)
        run: |
          git fetch --depth 1 origin models
          mkdir -p app/src/main/assets/models
          for n in vocals drums bass other; do
            git show FETCH_HEAD:$n.fp16.onnx > app/src/main/assets/models/$n.fp16.onnx
          done
          ls -la app/src/main/assets/models

      - name: Compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log
      - name: Testes e lint
        run: |
          ./gradlew testReleaseUnitTest lintRelease --console=plain --continue > test.log 2>&1 || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          tot=fail=0
          for f in glob.glob('app/build/test-results/testReleaseUnitTest/*.xml'):
              r=ET.parse(f).getroot()
              for tc in r.iter('testcase'):
                  tot+=1
                  for fl in list(tc.findall('failure'))+list(tc.findall('error')):
                      fail+=1
                      print('::error::TESTE '+tc.get('name')+': '+(fl.get('message') or '')[:300].replace('\n',' '))
          print(f'::notice::Testes: {tot-fail} de {tot} passaram')
          import re
          try:
              x=ET.parse('app/build/reports/lint-results-release.xml').getroot()
              errs=[i for i in x.iter('issue') if i.get('severity') in ('Error','Fatal')]
              print(f'::notice::Lint: {len(errs)} erros, {sum(1 for i in x.iter("issue") if i.get("severity")=="Warning")} avisos')
              for i in errs[:15]:
                  loc=i.find('location')
                  print('::error::LINT '+i.get('id')+': '+i.get('message')[:200]+' @ '+(loc.get('file').split('/')[-1]+':'+str(loc.get('line')) if loc is not None else ''))
          except Exception as e:
              print('::warning::lint sem relatório: '+str(e))
          PY
          grep -E "^e: " test.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Mostrar erros
        if: failure()
        run: |
          { grep -E "^e: |^ERROR|AAPT: error" build.log; grep -A10 "What went wrong" build.log; } | head -60 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Conferir APK
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          $AAPT dump badging app/build/outputs/apk/release/app-release.apk | head -3 | while IFS= read -r l; do echo "::notice::$l"; done
          ls -la app/build/outputs/apk/release/

      - name: Publicar APK no branch builds
        run: |
          mkdir out
          # arquivos no git têm limite de 100 MB: o APK vai em partes de 45 MB
          split -b 45m -d app/build/outputs/apk/release/app-release.apk out/app-release.apk.part
          sha256sum app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1 > out/app-release.sha256
          cd out
          git init -q -b builds
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -qm "APK de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
