name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --console=plain 2>&1 | tee build.log
      - name: Mostrar erros
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Conferir APK
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -1)
          $AAPT dump badging app/build/outputs/apk/release/app-release.apk | head -3 | while IFS= read -r l; do echo "::notice::$l"; done
          ls -la app/build/outputs/apk/release/

      - name: Publicar APK no branch builds
        run: |
          mkdir out && cp app/build/outputs/apk/release/app-release.apk out/
          cd out
          git init -q -b builds
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add app-release.apk
          git commit -qm "APK de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
